# .github/workflows/build.yml — copy to .github/workflows/build.yml
# Every push to main becomes a phone-installable APK via the rolling "latest" release.
# SETUP:
#   1. Run files/scripts/pin-actions.sh once to replace @v tags with SHAs.
#   2. Add the four ANDROID_KEYSTORE_* repository secrets (see skill section 2).
#   3. Wire signing in app/build.gradle.kts from env vars (see skill section 6).
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publishes the rolling latest release

jobs:
  build:
    name: Assemble APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # PIN ME

      - name: Set up JDK 17
        uses: actions/setup-java@v6 # PIN ME
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6 # PIN ME
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Accept Android SDK licenses
        run: (yes || true) | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Restore keystore
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            umask 077
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
            chmod 600 "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "No keystore secret present; release APK will be debug-signed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Assemble APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload artifacts (backup, 30 days)
        uses: actions/upload-artifact@v7 # PIN ME
        with:
          name: apks-${{ github.sha }}
          path: app/build/outputs/apk/*/app-*.apk
          retention-days: 30
          compression-level: 0 # APKs are already compressed

      - name: Delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish rolling latest release
        uses: softprops/action-gh-release@v3 # PIN ME
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          body: "Auto-built from main. Install app-release.apk on your phone."
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
