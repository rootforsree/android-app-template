# .github/workflows/ci.yml — copy to .github/workflows/ci.yml
# SETUP: run files/scripts/pin-actions.sh once to replace @v tags with SHAs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # PIN ME
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2 # PIN ME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # PIN ME

      - name: Set up JDK 17
        uses: actions/setup-java@v6 # PIN ME
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6 # PIN ME
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Accept Android SDK licenses
        run: (yes || true) | sdkmanager --licenses

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run checks (tests, Spotless, detekt, Lint)
        run: ./gradlew check --stacktrace
